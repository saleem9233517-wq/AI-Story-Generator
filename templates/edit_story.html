<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Story</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: #333;
        }

        .story-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .story-info p {
            margin: 7px 0;
            color: #555;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #667eea;
            box-shadow:
                0 0 0 2px
                rgba(102, 126, 234, 0.15);
        }

        textarea {
            min-height: 450px;
            resize: vertical;
            line-height: 1.7;
            font-family: Arial, sans-serif;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .save-button,
        .back-button {
            border: none;
            padding: 13px 20px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }

        .save-button {
            background: #667eea;
            color: white;
        }

        .save-button:hover {
            background: #4f5fd5;
        }

        .back-button {
            background: #eeeeee;
            color: #333;
        }

        .back-button:hover {
            background: #dddddd;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px 10px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            textarea {
                min-height: 350px;
            }

            .buttons {
                flex-direction: column;
            }

            .save-button,
            .back-button {
                width: 100%;
                text-align: center;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>✏️ Edit Story</h1>

    <div class="story-info">

        <p>
            <strong>Genre:</strong>
            {{ story[3] }}
        </p>

        <p>
            <strong>Length:</strong>
            {{ story[4] }}
        </p>

        <p>
            <strong>Tone:</strong>
            {{ story[5] }}
        </p>

    </div>


    <form
        method="POST"
        action="{{ url_for(
            'update_edited_story',
            story_id=story[0]
        ) }}"
    >

        <label for="title">
            Story Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            value="{{ story[1] or '' }}"
            required
        >


        <label for="story">
            Story
        </label>

        <textarea
            id="story"
            name="story"
            required
        >{{ story[6] }}</textarea>


        <div class="buttons">

            <button
                type="submit"
                class="save-button"
            >
                💾 Save Changes
            </button>

            <a
                href="{{ url_for('history') }}"
                class="back-button"
            >
                ← Back to History
            </a>

        </div>

    </form>

</div>

</body>
</html>
